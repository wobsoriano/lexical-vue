name: Preview

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true

      - name: Check
        run: vp check

      - name: Build
        run: vp run lexical-vue#build

      - name: Create a snapshot version
        id: snapshot
        run: vp dlx pkg-pr-new publish './packages/lexical-vue' --compact
