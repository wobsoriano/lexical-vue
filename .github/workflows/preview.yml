name: Preview

on: [push, pull_request]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1.18.0
        with:
          node-version-file: .node-version
          cache: true

      # The same task contributors run locally, so the two cannot drift.
      - name: Check, test and build
        run: vp run ready

      - name: Create a snapshot version
        id: snapshot
        run: vp dlx pkg-pr-new publish './packages/lexical-vue' --compact
